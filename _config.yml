title: "Game Hosting Guides"
description: "Independent, in-depth reviews and comparisons of Minecraft and game server hosting providers. Real-world tests, transparent pricing, and disclosed hardware specs."
url: "https://gamehostingguides.com"
baseurl: ""
author:
  name: "Wild Nature"
  url: "/about/"
publisher: "Game Hosting Guides"
contact_email: "ghguides@proton.me"
lang: en_US
timezone: UTC
logo: /assets/img/logo.jpg
image: /assets/img/logo.jpg

# Build settings
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# SEO / layout defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
  - scope:
      path: ""
      type: reviews
    values:
      layout: review
  - scope:
      path: ""
      type: videos
    values:
      layout: video
  - scope:
      path: ""
      type: guides
    values:
      layout: guide

collections:
  reviews:
    output: true
    permalink: /reviews/:name/
  videos:
    output: true
    permalink: /videos/:name/
  guides:
    output: true
    permalink: /guides/:name/

# Social profiles — used by jekyll-seo-tag and our Organization schema include
twitter:
  username: gamehostingguides
  card: summary_large_image

social:
  name: Game Hosting Guides
  links:
    - https://www.youtube.com/@GameHostingGuides
    - https://www.tiktok.com/@gamehostingguides
    - https://github.com/Game-Hosting-Guides

youtube_url: "https://www.youtube.com/@GameHostingGuides"
tiktok_url: "https://www.tiktok.com/@gamehostingguides"
github_org_url: "https://github.com/Game-Hosting-Guides"
discord_url: "/discord"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore
  - node_modules
  - scripts
